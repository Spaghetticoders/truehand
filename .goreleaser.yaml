version: 2
project_name: truehand
builds:
  - main: ./cmd/truehand
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - repository:
      owner: spaghetticoders
      name: homebrew-tap
    homepage: https://truehand.com
    description: Reliable hands for AI coding agents
    license: Apache-2.0
    test: system "#{bin}/truehand", "version"
