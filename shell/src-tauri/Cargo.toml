[package]
name = "truehand-shell"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-autostart = "=2.7.0"
security-framework = "=3.7.0"
ureq = { version = "=3.4.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
getrandom = "0.3"
base64 = "=0.22.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
